[package]
name = "myso-mls"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
openmls = "0.9.2"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tls_codec = "0.5.0"

# Browser / Node: randomness from crypto.getRandomValues.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = "0.32"

[features]
# `cargo run --features bindgen --bin uniffi-bindgen` generates the Swift bindings.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
openmls = { version = "0.9.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
